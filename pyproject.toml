[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".chromadb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "S", "RUF"]
ignore = [
    "RUF001",  # the UI intentionally uses emoji / typographic characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]  # asserts, dummy credentials and bind addresses

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "local_model: needs torch and transformers (skipped when they are not installed)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
