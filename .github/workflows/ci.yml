name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # The local-model integration tests skip themselves because torch is not installed here.
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pdf-chatbot:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 7860:7860 pdf-chatbot:ci
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:7860/ > /dev/null; then
              echo "App is serving after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready" >&2
          docker logs app
          exit 1
